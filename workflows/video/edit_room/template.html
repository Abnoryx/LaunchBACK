<title>LaunchBack Edit Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* An editing bay: scene rail | viewer | inspector, transport + timeline under the viewer. Motion = one spring (2% overshoot) on everything that moves; shapes morph (size, radius), they never pop. */
:root{--bg:#0d0d10;--bar:#131317;--panel:#17171c;--panel2:#1f1f26;--line:#2d2d36;--fg:#ededf2;--muted:#9a9aa6;--accent:#f2f2f5;--accent-ink:#0d0d10;--keep:#f2f2f5;--chg:#b8b8c2;--spring:cubic-bezier(.2,.8,.2,1);--out:cubic-bezier(.16,1,.3,1);--head:'Space Grotesk','Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;color-scheme:dark}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0, 0.036, 0.125, 0.24, 0.365, 0.487, 0.599, 0.697, 0.78, 0.848, 0.901, 0.942, 0.971, 0.992, 1.006, 1.014, 1.018, 1.02, 1.019, 1.018, 1.016, 1.013, 1.011, 1.009, 1.006, 1.005, 1.003, 1.002, 1.001, 1.001, 1, 1, 1, 1, 1)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);-webkit-text-size-adjust:100%;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .45s var(--spring),background-color .3s,color .3s,border-color .3s,border-radius .45s var(--spring),opacity .25s,box-shadow .3s}
button:active{transform:scale(.94)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96);filter:blur(5px)}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}}
@keyframes fadeIn{from{opacity:0;filter:blur(6px)}}
@keyframes slide{from{opacity:0;transform:translateX(14px);filter:blur(4px)}}
@keyframes grow{from{grid-template-rows:0fr;opacity:0}}
@keyframes leave{to{opacity:0;transform:translateX(26px) scale(.94);filter:blur(4px)}}
@keyframes popIn{from{scale:.2;opacity:0}60%{scale:1.1}}
@keyframes bump{40%{scale:1.22}}
@keyframes shape{0%{width:34px;height:34px;border-radius:9px;rotate:0deg}28%{width:34px;height:34px;border-radius:50%;rotate:90deg}55%{width:60px;height:18px;border-radius:999px;rotate:90deg}82%{width:34px;height:34px;border-radius:9px;rotate:180deg}100%{width:34px;height:34px;border-radius:9px;rotate:180deg}}
.app{display:grid;grid-template-columns:136px minmax(0,1fr) 372px;grid-template-rows:48px minmax(0,1fr);height:100dvh;min-height:520px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0);animation:drop .7s var(--spring) backwards}
.top h1{font:700 15px var(--head);margin:0;letter-spacing:-.01em;white-space:nowrap}.top h1 small{font:500 11px var(--body);color:var(--muted);margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.sp{flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;animation:rise .6s var(--spring) backwards}.pill b{color:var(--fg);display:inline-block}
.pill b.bump{animation:bump .5s var(--spring)}
#sync{font-size:12px;color:var(--muted);min-width:70px;text-align:right;display:inline-block}#sync.sw{animation:fadeIn .4s var(--out)}
.rail{grid-row:2;overflow:auto;background:var(--bar);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.ri{position:relative;border:2px solid transparent;border-radius:8px;background:var(--panel);padding:4px;text-align:left;display:block;width:100%;animation:rise .6s var(--spring) backwards;animation-delay:calc(var(--i,0)*45ms);transition:transform .45s var(--spring),border-color .3s,background-color .3s,border-radius .45s var(--spring)}
.ri[aria-current="true"]{border-color:var(--accent);border-radius:12px}
.ri .th{position:relative;border-radius:5px;overflow:hidden;background:#000;aspect-ratio:9/16}
.ri video,.ri .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ri video{opacity:0;filter:blur(8px);transition:opacity .5s var(--out),filter .5s var(--out)}.ri.ready video{opacity:1;filter:none}
.ri .ph{display:grid;place-items:center;color:var(--muted);font-size:11px}
.ri .sk,.ld i{display:block;background:#fff;animation:shape 1.7s var(--spring) infinite}.ri .sk{position:absolute;left:50%;top:50%;margin:-7px 0 0 -7px;width:14px;height:14px;opacity:.9;transition:opacity .3s;animation-name:shape14}
@keyframes shape14{0%{width:14px;height:14px;border-radius:4px;rotate:0deg}28%{width:14px;height:14px;border-radius:50%;rotate:90deg}55%{width:26px;height:8px;border-radius:999px;rotate:90deg}82%{width:14px;height:14px;border-radius:4px;rotate:180deg}100%{width:14px;height:14px;border-radius:4px;rotate:180deg}}
.ri.ready .sk{opacity:0}
.ri .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}.ri .lb b{color:var(--fg)}
.ri .dot{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%;background:transparent;border:2px solid #fff;box-shadow:0 0 0 1px #0006;transition:background .3s,scale .45s var(--spring);z-index:2}
.ri .dot.keep{background:#fff;scale:1.25}.ri .dot.change{background:linear-gradient(90deg,#fff 50%,transparent 50%);scale:1.25}
.ri .pc{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font:700 11px/18px var(--body);min-width:18px;text-align:center;padding:0 5px;z-index:2;transition:opacity .3s,scale .45s var(--spring)}
.ri .pc[hidden]{display:block;opacity:0;scale:.3}.ri .pc.pop{animation:bump .5s var(--spring)}
.ri.reel{background:var(--panel2)}.ri.reel .th{aspect-ratio:16/9}.ri.reel .ph{font-weight:600;color:var(--fg)}
.deck{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.view{flex:1;min-height:0;position:relative}
.stage{position:absolute;top:12px;bottom:12px;left:50%;transform:translateX(-50%);aspect-ratio:9/16;max-width:calc(100% - 24px);background:#000;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 12px 40px #0008;touch-action:manipulation;user-select:none;transition:box-shadow .4s var(--out),border-radius .5s var(--spring);animation:fadeIn .8s var(--out) backwards}
.stage.pm{box-shadow:0 0 0 2px var(--accent),0 12px 40px #0008;border-radius:12px}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit;opacity:0;filter:blur(10px);scale:1.03;transition:opacity .5s var(--out),filter .5s var(--out),scale .7s var(--spring)}
.stage.ready video{opacity:1;filter:none;scale:1}
.stage.noclip::after{content:"preview not uploaded";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.ld{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .3s var(--out)}.stage.loading .ld{opacity:1;transition-delay:.3s}.ld i{width:34px;height:34px}
.pbig{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;pointer-events:none;z-index:2;opacity:0;scale:.5;transition:opacity .3s,scale .55s var(--spring)}.stage.paused .pbig{opacity:1;scale:1}
.pi{position:relative;display:block;width:20px;height:18px}.pi i{position:absolute;top:0;height:18px;background:currentColor;left:2px;width:5px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:left .5s var(--spring),width .5s var(--spring),clip-path .5s var(--spring)}.pi i+i{left:12px}
[data-p="play"] .pi i{left:3px;width:9px;clip-path:polygon(0 0,100% 25%,100% 75%,0 100%)}[data-p="play"] .pi i+i{left:12px;width:8px;clip-path:polygon(0 25%,100% 50%,100% 50%,0 75%)}
.ov{position:absolute;inset:0;overflow:hidden;border-radius:inherit}.ov.pinning{cursor:crosshair;touch-action:none}
.pin{--pc:var(--accent);position:absolute;border:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent);box-shadow:0 0 0 2px #0007;color:var(--accent-ink);touch-action:none;cursor:grab;animation:popIn .5s var(--spring) backwards;
 transition:opacity .18s,background .2s,box-shadow .3s,scale .3s var(--spring)}
.ov.anim .pin{transition:left .45s var(--spring),top .45s var(--spring),width .45s var(--spring),height .45s var(--spring),border-radius .45s var(--spring),transform .45s var(--spring),opacity .18s,background .2s,box-shadow .3s,scale .3s var(--spring)}
.pin::before{content:"";position:absolute;inset:-14px}
.pin.dying{scale:.2;pointer-events:none}
.pin.sel{box-shadow:0 0 0 2px #0009,0 0 0 5px #fff}.pin.act{box-shadow:0 0 0 2px #0009,0 0 0 5px #fff;border-style:solid}
.pin .n{position:absolute;left:-3px;top:-3px;transform:translate(-45%,-100%);background:var(--pc);color:var(--accent-ink);border-radius:999px;font:700 11px/18px var(--body);min-width:18px;padding:0 5px;text-align:center;white-space:nowrap;transition:transform .45s var(--spring)}
.pin[data-m="precise"] .n{transform:rotate(-45deg) translate(-40%,-110%)}
.pin[data-m="auto"]:not(.rect){border-style:dashed}
.cn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.cn line{stroke:#fff;stroke-width:2;stroke-dasharray:5 5;opacity:.8}
.ghost{position:absolute;width:26px;height:26px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;box-shadow:0 0 0 1px #0008;transition:opacity .2s,width .4s var(--spring),height .4s var(--spring),border-radius .4s var(--spring)}.ghost.on{opacity:.9}.ghost[data-m=precise]{border-radius:3px;width:16px;height:16px}.ghost[data-m=frame]{border-radius:6px;width:40px;height:40px}
.hint{position:absolute;top:18px;left:50%;transform:translate(-50%,-10px) scale(.94);background:#000b;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;pointer-events:none;opacity:0;filter:blur(4px);transition:opacity .3s,transform .5s var(--spring),filter .3s;z-index:3;white-space:nowrap}.hint.show{opacity:1;transform:translate(-50%,0) scale(1);filter:none}
.tp{border-top:1px solid var(--line);background:var(--bar);padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px;animation:rise .7s var(--spring) .15s backwards}
.tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tr button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-width:44px;min-height:44px;font:600 14px var(--body)}
.tr button.play{min-width:56px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border-radius:12px}.tr button.play:active{transform:scale(.9)}
.tr .tc{font:500 13px ui-monospace,Menlo,monospace;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;white-space:nowrap}.tr .tc b{color:var(--fg);font-weight:500}
.gr{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--spring),opacity .3s}.gr.on{grid-template-rows:1fr;opacity:1}.gr>.gi{overflow:hidden;min-height:0}
.grx{display:grid;grid-template-columns:0fr;opacity:0;transition:grid-template-columns .5s var(--spring),opacity .3s}.grx.on{grid-template-columns:1fr;opacity:1}.grx>.gi{overflow:hidden;min-width:0}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:4px 6px 4px 14px;font:600 12px var(--body);display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:48px}.banner button{background:var(--accent-ink);color:var(--accent);border:0;border-radius:8px;padding:6px 12px;min-height:40px;font:600 12px var(--body)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools>button{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;font:600 12px var(--body);min-height:44px}
.tools>button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:999px}
.mode{position:relative;display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;isolation:isolate;--n:3}
.mode .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));background:var(--accent);border-radius:7px;transition:transform .5s var(--spring),opacity .3s,border-radius .5s var(--spring);z-index:-1}
.mode.none .th{opacity:0}
.mode button{flex:1;background:transparent;border:0;padding:6px 10px;min-height:40px;font:600 12px var(--body);color:var(--muted);border-radius:7px;white-space:nowrap}
.mode button[aria-pressed="true"]{color:var(--accent-ink)}
.mode.two{--n:2}.mode.two button{min-height:44px}.nm{display:inline-flex;margin:0}
.tl{position:relative;height:64px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);touch-action:none;cursor:ew-resize;overflow:hidden;outline-offset:2px}
.blk{position:absolute;top:22px;bottom:4px;border-radius:5px;background:var(--panel);border:1px solid var(--line);font:600 10px/1 var(--body);color:var(--muted);padding:4px 5px;overflow:hidden;white-space:nowrap;pointer-events:none;transition:background-color .35s,border-color .35s,color .35s,border-radius .45s var(--spring)}
.blk.cur{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--fg);border-color:var(--accent);border-radius:8px}
.blk::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--keep);transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--spring)}.blk.keep::after,.blk.change::after{transform:scaleY(1)}.blk.change::after{background:var(--chg)}
.mk{position:absolute;top:2px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);background:var(--accent);border:2px solid var(--bg);border-radius:3px;pointer-events:none;animation:popIn .5s var(--spring) backwards;transition:left .45s var(--spring),box-shadow .3s,scale .45s var(--spring)}
.mk.sel{box-shadow:0 0 0 2px #fff;scale:1.3}
.gb{position:absolute;top:18px;height:3px;background:repeating-linear-gradient(90deg,var(--fg) 0 6px,transparent 6px 10px);pointer-events:none;opacity:.8;transition:left .45s var(--spring),width .45s var(--spring);animation:fadeIn .5s backwards}
.ph-line{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px #0008;pointer-events:none;transform:translateX(-1px)}
.ph-line::before{content:"";position:absolute;top:-1px;left:-5px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.insp{grid-column:3;grid-row:2;background:var(--bar);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;animation:slide .7s var(--spring) .1s backwards}
.tabs{display:flex;border-bottom:1px solid var(--line);position:relative}
.tabs button{flex:1;background:transparent;border:0;padding:12px 6px;font:600 13px var(--body);color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs i{position:absolute;bottom:-1px;left:0;height:2px;width:33.333%;background:var(--accent);transition:transform .55s var(--spring)}
.pane{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.pane[hidden]{display:none}.pane.in{animation:slide .5s var(--spring)}
.pane>*{animation:rise .55s var(--spring) backwards;animation-delay:calc(var(--i,0)*40ms)}.pane.still>*{animation:none}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;gap:0;display:flex;flex-direction:column;cursor:pointer;transition:border-color .3s,border-radius .45s var(--spring),background-color .3s,transform .45s var(--spring)}
.row.enter{animation:rise .55s var(--spring) backwards;animation-delay:calc(var(--i,0)*40ms)}
.row.leaving{animation:leave .26s var(--out) forwards;pointer-events:none}
.row.sel{border-color:var(--fg);border-radius:14px}
.row .hd{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 0;flex-wrap:nowrap;min-height:44px}
.row .bd{background:var(--accent);color:var(--accent-ink);border-radius:999px;font:700 11px/18px var(--body);min-width:18px;padding:0 6px;text-align:center}
.row .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .md{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}.row .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.row .bdy{display:grid;grid-template-rows:1fr;border-top:1px solid var(--line);cursor:default}.row .bdy.fresh{animation:grow .55s var(--spring)}.row .bi{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px}
.tg{display:flex;gap:4px;flex-wrap:wrap}.tg button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;min-height:40px}.tg button[aria-pressed="true"]{border-color:var(--chg);color:var(--chg);border-radius:999px}
.sech{font:600 11px var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:2px 0 -4px}
.ck{flex:none;width:44px;height:44px;background:transparent;border:0;position:relative}.ck::after{content:"";position:absolute;left:12px;top:12px;width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;transition:background .25s,border-color .25s,border-radius .45s var(--spring),scale .45s var(--spring)}.ck[aria-pressed="true"]::after{background:var(--fg);border-color:var(--fg);border-radius:50%;scale:1.08;content:"✓";color:var(--bg);font:700 13px/14px var(--body);text-align:center}
#abw{position:sticky;top:-12px;z-index:5;margin:-12px -12px 0;animation:none}
.ab{padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 16px #0006}
.abh{display:flex;align-items:center;gap:8px}.abh b{margin-right:auto;font-size:13px}.ab button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:6px 12px;font:600 12px var(--body)}.ab button.ghost{background:transparent;border-color:transparent;color:var(--muted)}.ab button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}.ab button.dang{color:var(--muted)}
.ab button.dang.done{background:var(--fg);color:var(--bg);border-color:var(--fg);border-radius:999px;padding:6px 22px}
.ab .mode{width:100%}.ab .mode button{background:transparent;border:0;min-height:40px;padding:6px 10px}.abr{display:flex;gap:6px;flex-wrap:wrap}
.grp{border:1px solid var(--muted);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--panel2);transition:border-color .3s,box-shadow .3s,border-radius .45s var(--spring)}.grp.enter{animation:rise .55s var(--spring) backwards}
.grp.act{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}.grp .gh{display:flex;align-items:center;gap:6px}.grp .gt{background:transparent;border:0;font:700 13px var(--head);padding:8px 0;min-height:44px;text-align:left}
.grp .sm{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:6px 10px;font:600 12px var(--body)}
.res{font-size:12px;color:var(--muted)}
.phd{display:flex;align-items:center;gap:8px;font:600 12px var(--body);color:var(--muted)}
.rst{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:6px 14px;font:600 12px var(--body);color:var(--fg)}
.rst.arm{background:var(--fg);color:var(--bg);border-color:var(--fg);border-radius:999px;padding:6px 18px}.rst.done{background:var(--muted);color:var(--bg);border-radius:999px}
.xr{flex:none;width:44px;height:44px;background:transparent;border:0;color:var(--muted);font:400 22px/1 var(--body)}.xr:hover{color:var(--fg)}
.pin.gh{box-shadow:none}
textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;transition:border-color .3s,border-radius .45s var(--spring),box-shadow .3s}
textarea:focus,input[type=text]:focus{border-radius:12px;border-color:var(--muted)}
textarea{min-height:64px;resize:vertical}
input.changed{border-color:var(--chg)}
label.f{display:block;font-size:11px;color:var(--muted);margin:0 0 3px;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--muted);font-size:12px;min-height:32px}
.keys{font-size:12px;color:var(--muted)}.keys kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:500 11px ui-monospace,Menlo,monospace;color:var(--fg)}
@media (max-width:900px){
 :root{--deck:min(56dvh,520px);--top:calc(44px + env(safe-area-inset-top,0px))}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;const k=e.key,mod=e.metaKey||e.ctrlKey;
 if(mod){if(k==='z'||k==='Z'){e.preventDefault();undo(e.shiftKey)}else if(k==='y'){e.preventDefault();undo(true)}else if(k==='a'||k==='A'){e.preventDefault();S.sel=new Set(pins.reel.map(p=>p.id));refresh()}return}
 if(e.altKey)return;
 if(k===' '){e.preventDefault();toggle()}else if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();vid.pause();seek(vid.currentTime+(k==='ArrowLeft'?-1:1)*(e.shiftKey?1:1/FPS))}
 else if(k==='['){jump(-1)}else if(k===']'){jump(1)}else if(k==='p'||k==='P'){$('#bPin').click();hint(S.tool?'Pin mode on: tap the video to pin':'Pin mode off: tap the video to play')}
 else if(k==='l'||k==='L'){$('#bLoop').click()}else if(k==='m'||k==='M'){$('#bSnd').click()}
 else if(k==='g'||k==='G'){e.preventDefault();groupSel()}else if(k==='u'||k==='U'){ungroupSel()}
 else if(k==='n'||k==='N'){const a=pins.reel;if(a.length){const t=rt(),c=e.shiftKey?[...a].reverse().find(p=>p.t<t-.05):a.find(p=>p.t>t+.05),q=c||(e.shiftKey?a[a.length-1]:a[0]);pick(q.id,false,true)}}
 else if(k==='1'||k==='2'||k==='3'){if(S.sel.size)bulkMode(MODES[+k-1]);else{S.newMode=MODES[+k-1];paintBanner()}}
 else if(k==='Delete'||k==='Backspace'){if(S.sel.size){e.preventDefault();delAnimated()}}
 else if(k==='Escape'){S.sel=new Set();S.active='';S.tool=false;paintTool();refresh()}});
