<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Inter Variable";src:url(/nm/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:"Inter Variable";src:url(/nm/@fontsource-variable/inter/files/inter-latin-wght-italic.woff2) format("woff2");font-weight:100 900;font-style:italic}
@font-face{font-family:"Inter Tight Variable";src:url(/nm/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Anton";src:url(/nm/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:"Tinos";src:url(/nm/@fontsource/tinos/files/tinos-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:"Tinos";src:url(/nm/@fontsource/tinos/files/tinos-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:"Tinos";src:url(/nm/@fontsource/tinos/files/tinos-latin-700-italic.woff2);font-weight:700;font-style:italic}
@font-face{font-family:"Patrick Hand";src:url(/nm/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2)}
@font-face{font-family:"League Gothic";src:url(/nm/@fontsource/league-gothic/files/league-gothic-latin-400-normal.woff2)}
@font-face{font-family:"Archivo Narrow";src:url(/nm/@fontsource/archivo-narrow/files/archivo-narrow-latin-700-normal.woff2);font-weight:700}
body{margin:0;background:#000}</style></head><body><canvas id="c"></canvas>
<script type="module">
import { Engine, setBlurK } from '/engine/engine.js';
const project = await (await fetch('/project.json')).json();
const cfg = await (await fetch('/config.json')).json();
const cv = document.getElementById('c');
if (cfg.blurK) setBlurK(cfg.blurK);
const comp = project.comps.find((c) => c.name === cfg.comp);
cv.width = comp.w; cv.height = comp.h;
const eng = new Engine(project, {
  mbSamples: cfg.samples,
  assetUrl: (f) => (f.file ? '/asset/' + encodeURIComponent(f.file.split(/[\\/]/).pop()) : null),
  videoFrameUrl: (f, t) => (f.file ? `/vid/${f.id}/${Math.max(0, Math.round(t * 1000))}.jpg?name=${encodeURIComponent(f.file.split(/[\\/]/).pop())}` : null),
});
await eng.init(cv);
window.renderFrame = async (t) => {
  const acc = await eng.frame(comp, t);
  eng.g.run('copy', { fb: null, w: comp.w, h: comp.h }, {}, { uTex: acc });
  eng.g.release(acc);
  const gl = eng.g.gl, px = new Uint8Array(comp.w * comp.h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, comp.w, comp.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < px.length; i += CH) s += String.fromCharCode.apply(null, px.subarray(i, i + CH));
  return btoa(s);
};
window.engineWarnings = () => [...eng.warned];
window.ready = true;
</script></body></html>
