<script type="module">
import { Engine, setBlurK } from '/engine/engine.js';
const project = await (await fetch('/project.json')).json();
const cfg = await (await fetch('/config.json')).json();
const cv = document.getElementById('c');
if (cfg.blurK) setBlurK(cfg.blurK);
let comp = project.comps.find((c) => c.name === cfg.comp);
cv.width = comp.w; cv.height = comp.h;
const engOpts = {
  mbSamples: cfg.samples,
  ...(cfg.supersample ? { supersample: cfg.supersample } : {}),
  assetUrl: (f) => (f.file ? '/asset/' + encodeURIComponent(f.file.split(/[\\/]/).pop()) : null),
  // footage Loop = 1 means play once (AE interpretation); only > 1 wraps, for that many passes.
  // AE shows the source frame that started at or before t (floor); ffmpeg -ss returns the first frame at or after the
  // seek time, so seek to just before that frame's start
  videoFrameUrl: (f, t) => (f.file ? `/vid/${f.id}/${Math.max(0, Math.round((((tt) => (f.frame_rate > 0 ? Math.floor(tt * f.frame_rate + 1e-4) / f.frame_rate - 0.001 : tt))((f.loop > 1 && f.duration) ? (t < f.duration * f.loop ? t % (f.duration - 0.05) : t) : t)) * 1000))}.jpg?name=${encodeURIComponent(f.file.split(/[\\/]/).pop())}` : null),
};
let eng = new Engine(project, engOpts);
eng.modelOpts = cfg.modelOpts || {};
eng.luts = cfg.luts || {};
await eng.init(cv);
// server mode: swap in a new project (fitting loops), keeping the loaded page and image cache
window.setProject = async (pj, compName) => {
  const images = eng.images;
  eng = new Engine(pj, engOpts); eng.modelOpts = cfg.modelOpts || {}; eng.luts = cfg.luts || {};
  await eng.init(cv); eng.images = images;
  comp = pj.comps.find((c) => c.name === (compName || cfg.comp));
};
// pick mode (server): show only some layers of one comp, to find which layer owns a pixel (/gen Edit Room pins). only = null restores.
const _en = new Map();
window.setOnly = (compName, only) => {
  if (!only) { for (const [L, v] of _en) L.enabled = v; _en.clear(); return true; }   // restore every comp touched, whatever comp was named
  const c = eng.compsByName.get(compName); if (!c) return false;
  for (const L of c.layers) { if (!_en.has(L)) _en.set(L, L.enabled); L.enabled = only.includes(L.i); }
  return true;
};
// small RGBA frame (for scoring), scaled on a 2D canvas
window.renderSmall = async (t, w, h) => {
  await window.renderFrame(t, true);
  const sm = window._sm || (window._sm = new OffscreenCanvas(w, h)); const c2 = sm.getContext('2d');
  c2.setTransform(1, 0, 0, -1, 0, h);   // the GL canvas is stored bottom-up (readPixels order): flip like the full path
  c2.clearRect(0, 0, w, h); c2.drawImage(cv, 0, 0, w, h); c2.setTransform(1, 0, 0, 1, 0, 0);
  const px = c2.getImageData(0, 0, w, h).data;
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < px.length; i += CH) s += String.fromCharCode.apply(null, px.subarray(i, i + CH));
  return btoa(s);
};
window.renderFrame = async (t, drawOnly) => {
  const acc = await eng.frame(comp, t);
  eng.g.run('copy', { fb: null, w: comp.w, h: comp.h }, {}, { uTex: acc });
  eng.g.release(acc);
  if (drawOnly) return null;
  const gl = eng.g.gl, px = new Uint8Array(comp.w * comp.h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, comp.w, comp.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < px.length; i += CH) s += String.fromCharCode.apply(null, px.subarray(i, i + CH));
  return btoa(s);
};
window.engineWarnings = () => [...eng.warned];
window.ready = true;
</script></body></html>
